modLoader="javafml"
loaderVersion="[12,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Automatically organises items registered by installed mods into dedicated creative inventory tabs.
'''
authors="Deoda"

# Creative-screen navigation sync (see NavigationBridgeHooks): only applied
# when Fabric API is actually loaded (Fabricated-NeoForge and friends); a
# plain NeoForge install never transforms the creative screen. The mixins are
# additionally runtime-gated by syncFabricCreativeTabNavigation (default off).
[[mixins]]
config="automodtabs.mixins.json"
requiredMods=["fabric_api"]

[[dependencies.automodtabs]]
    modId="neoforge"
    type="required"
    versionRange="[26.3.0.99,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.automodtabs]]
    modId="minecraft"
    type="required"
    versionRange="[26.3]"
    ordering="NONE"
    side="CLIENT"
